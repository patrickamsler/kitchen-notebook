# API messages (English). Problem titles and details: problem.<slug>.title / problem.<slug>.detail,
# where <slug> is the last part of the problem type urn:kn:problem:<slug>.

problem.bad-request.title=Bad request
problem.bad-request.detail=The request could not be processed.
problem.validation.title=Invalid request
problem.validation.detail=One or more fields are invalid.
problem.malformed-request.title=Malformed request
problem.malformed-request.detail=The request body could not be read.
problem.unauthenticated.title=Not signed in
problem.unauthenticated.detail=Sign in to continue.
problem.forbidden.title=Not allowed
problem.forbidden.detail=You are not allowed to do this.
problem.csrf.title=Request not trusted
problem.csrf.detail=The request is missing a valid CSRF token. Reload the page and try again.
problem.not-found.title=Not found
problem.not-found.detail=The requested resource does not exist.
problem.method-not-allowed.title=Method not allowed
problem.method-not-allowed.detail=This resource does not support the request method.
problem.not-acceptable.title=Not acceptable
problem.not-acceptable.detail=The requested response format is not supported.
problem.conflict.title=Conflict
problem.conflict.detail=The request conflicts with the current state of the resource.
problem.payload-too-large.title=Request too large
problem.payload-too-large.detail=The request body is too large.
problem.unsupported-media-type.title=Unsupported media type
problem.unsupported-media-type.detail=The request body format is not supported.
problem.unavailable.title=Service unavailable
problem.unavailable.detail=The service is temporarily unavailable. Try again later.
problem.internal.title=Something went wrong
problem.internal.detail=An unexpected error occurred. If it persists, report it with the reference {0}.
problem.error.title=Error
problem.error.detail=The request failed.
