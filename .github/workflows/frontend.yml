name: frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.82.0 lint ../api/openapi.yaml
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run i18n:check
